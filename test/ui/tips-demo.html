<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brush tips module demo</title>
<link rel="stylesheet" href="../../disintegration-studio/ui-tips.css">
<style>
  html, body { margin: 0; background-color: #1A1A1A; font-family: system-ui, sans-serif; font-size: 11px; color: #E6E6E6; }
  #wrap { display: flex; flex-direction: row; padding: 16px; }
  #right { position: relative; flex: 0 0 360px; width: 360px; height: 640px; background-color: #262626; display: flex; flex-direction: column; }
  #scroll { flex: 1 1 auto; overflow-y: auto; padding: 10px; }
  .card { background-color: #2F2F2F; border: 1px solid #3B3B3B; border-radius: 8px; padding: 10px; }
  .title { color: #C46BD8; font-weight: bold; font-size: 12px; margin-bottom: 6px; }
  #log { margin-left: 16px; flex: 1 1 auto; min-width: 200px; height: 640px; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap; color: #A3A3A3; }
  .tools { margin-top: 8px; }
  .tools span { display: inline-block; background-color: #3A3A3A; padding: 3px 8px; margin-right: 4px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <div id="right">
    <div id="scroll">
      <div class="card">
        <div class="title">Brush tips</div>
        <div id="tipsHost"></div>
      </div>
      <div class="tools">
        <span id="undo">Undo (last setTips)</span>
        <span id="reset">Reset fx.tips</span>
      </div>
    </div>
  </div>
  <div id="log"></div>
</div>
<script src="../../disintegration-studio/js/disintegration-core.js"></script>
<script src="../../disintegration-studio/js/ui-raster.js"></script>
<script src="../../disintegration-studio/js/ui-tips.js"></script>
<script>
  const D = window.Disintegration;
  // two fake tips of the user's own, so "My tips" and deletion can be tried
  function ring(n, r0, r1) { const d = new Uint8Array(n * n); for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const r = Math.hypot(x - n / 2 + 0.5, y - n / 2 + 0.5) / (n / 2); d[y * n + x] = r > r0 && r < r1 ? 255 : 0; } return d; }
  function star(n) { const d = new Uint8Array(n * n); for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const dx = x - n / 2 + 0.5, dy = y - n / 2 + 0.5, a = Math.atan2(dy, dx), r = Math.hypot(dx, dy) / (n / 2); d[y * n + x] = r < 0.45 + 0.45 * Math.abs(Math.cos(a * 2.5)) ? 255 : 0; } return d; }
  let custom = [{ id: 'cdemo1', label: '★ My tip 1', n: 48, data: ring(48, 0.45, 0.95) }, { id: 'cdemo2', label: '★ My tip 2', n: 48, data: star(48) }];
  D.setCustomTips(custom);

  const fx = { tips: { chip: 0.35, flake: 0.3, splat: 0.12 } };
  const history = [];
  const logEl = document.getElementById('log');
  function log(msg) { logEl.textContent = msg + '\n' + logEl.textContent; console.log(msg); }

  const api = {
    getTips: () => fx.tips,
    setTips: (map) => { history.push(fx.tips); fx.tips = map; log('setTips ' + JSON.stringify(map)); },
    tipList: () => D.tipList(),
    tipPreview: (id, n) => D.tipPreview(id, n),
    deleteCustomTip: (id) => {
      custom = custom.filter((t) => t.id !== id);
      D.setCustomTips(custom);
      delete fx.tips[id];
      fx.tips = D.normalize(fx).tips;
      log('deleteCustomTip ' + id + ' → ' + JSON.stringify(fx.tips));
      panel.refresh();
    },
    overlayHost: document.getElementById('right'),
  };
  const panel = DSUI.tips.mount(document.getElementById('tipsHost'), api);
  window.__demo = { fx, api, panel };
  document.getElementById('undo').addEventListener('click', () => { if (history.length) { fx.tips = history.pop(); log('undo → ' + JSON.stringify(fx.tips)); panel.refresh(); } });
  document.getElementById('reset').addEventListener('click', () => { fx.tips = { chip: 0.35, flake: 0.3, splat: 0.12 }; log('reset'); panel.refresh(); });
</script>
</body>
</html>
